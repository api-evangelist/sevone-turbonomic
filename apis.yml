name: SevOne (Turbonomic)
description: >-
  SevOne and Turbonomic are enterprise IT operations products now part of IBM's
  AIOps portfolio. IBM SevOne Network Performance Management (NPM) delivers
  real-time, multi-vendor network monitoring, flow analytics, and capacity
  planning across hybrid and enterprise networks. IBM Turbonomic is an
  application resource management (ARM) platform that continuously analyzes
  application demand and automates resourcing, scaling, and placement decisions
  across on-premises, cloud, and Kubernetes environments to assure performance
  while reducing cost. Both products expose REST APIs, but those APIs are hosted
  on the customer's own appliance / deployment rather than on a public developer
  portal, so there is no public base URL or published OpenAPI to catalog: the
  Turbonomic REST API is served from the appliance (for example the /vmturbo/rest
  path with its bundled Swagger UI), and SevOne exposes the SevOne NMS API and
  SevOne Data Insight API from the deployed instance. Product and API reference
  documentation is published by IBM.
